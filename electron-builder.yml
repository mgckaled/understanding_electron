# Must stay identical to APP_ID in src/shared/meta.ts — see that file for what
# breaks on Windows when the two drift apart.
appId: com.mgckaled.crivo
productName: crivo
directories:
  buildResources: build
# Deny-by-default, and that inversion is the whole point.
#
# This was a list of exclusions, which can only ever enumerate what somebody
# remembered. Phase 07 found .claude/settings.local.json (a personal MCP API
# key) inside app.asar along with coverage/, docs/, e2e/, scripts/ and test/;
# a later audit of the same package still found CLAUDE.md, .mcp.json,
# config/aliases.ts and pnpm-workspace.yaml, because nobody had thought to add
# them. An exclusion list rots every time a file appears in the repository
# root — an allow-list cannot, since a new file is out until opted in.
#
# electron-builder packages straight from disk, not from what git tracks, so
# .gitignore protects nothing here. Verify with @electron/asar list after any
# change, never by reading the globs. See docs/HISTORY.md.
files:
  - '!**/*'
  - 'out/**'
  - 'resources/**'
  - 'package.json'
  - 'node_modules/**'
  # zod ships its full TypeScript source and ~700 test files. None of it is
  # reachable at runtime, and it was most of the packaged size.
  - '!node_modules/zod/src/**'
asarUnpack:
  - resources/**
win:
  executableName: crivo
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Camera and microphone came from the template and were never used. Declaring
    # a permission an app does not exercise prompts the user for no reason and is
    # grounds for App Store rejection. Only the two folders a data file is
    # realistically opened from are left.
    - NSDocumentsFolderUsageDescription: crivo reads the data files you open from your Documents folder.
    - NSDownloadsFolderUsageDescription: crivo reads the data files you open from your Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: mgckaled
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
