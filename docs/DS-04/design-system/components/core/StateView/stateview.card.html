<!-- @dsCard group="Components" viewport="700x340" subtitle="idle / loading / ready / empty / error" name="StateView" -->
<link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<div id="root" style="background:var(--color-bg);padding:20px;height:100%;"></div>
<script type="text/plain" id="app-src">
const { StateView, Panel } = window.Crivo;
function Demo() {
  const states = [
    { title: 'loading', state: { status: 'loading' } },
    { title: 'empty', state: { status: 'empty' } },
    { title: 'error', state: { status: 'error', error: { message: 'Serviço indisponível no momento.' } } },
    { title: 'ready', state: { status: 'ready', data: ['gemma3:4b', 'qwen2.5:7b'] } },
  ];
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, fontFamily: 'var(--font-ui)' }}>
      {states.map((s) => (
        <Panel key={s.title} title={s.title}>
          <StateView state={s.state} emptyMessage="Nenhum modelo instalado." render={(data) => (
            <ul style={{ margin: 0, padding: 0, fontSize: 13, color: 'var(--color-text)' }}>
              {data.map((d) => <li key={d}>{d}</li>)}
            </ul>
          )} />
        </Panel>
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<script>
(function(){
  var code = document.getElementById('app-src').textContent;
  var out = Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code;
  var s = document.createElement('script');
  s.text = out;
  document.body.appendChild(s);
})();
</script>
