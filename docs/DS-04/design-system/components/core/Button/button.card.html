<!-- @dsCard group="Components" viewport="700x260" subtitle="Primary / secondary / ghost / danger, 3 sizes, loading" name="Button" -->
<link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<div id="root" style="background:var(--color-bg);padding:20px;height:100%;"></div>
<script type="text/plain" id="app-src">
const { Button } = window.Crivo;
function Demo() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14, fontFamily: 'var(--font-ui)' }}>
      <div style={{ display: 'flex', gap: 10 }}>
        <Button variant="primary">Enviar</Button>
        <Button variant="secondary">Cancelar</Button>
        <Button variant="ghost">Configurações</Button>
        <Button variant="danger">Excluir</Button>
      </div>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
        <Button variant="secondary" size="sm">Pequeno</Button>
        <Button variant="secondary" size="md">Médio</Button>
        <Button variant="secondary" size="lg">Grande</Button>
      </div>
      <div style={{ display: 'flex', gap: 10 }}>
        <Button variant="primary" loading>Enviando</Button>
        <Button variant="secondary" disabled>Desabilitado</Button>
        <Button variant="ghost" size="sm" aria-label="Fechar">×</Button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<script>
(function(){
  var code = document.getElementById('app-src').textContent;
  var out = Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code;
  var s = document.createElement('script');
  s.text = out;
  document.body.appendChild(s);
})();
</script>
