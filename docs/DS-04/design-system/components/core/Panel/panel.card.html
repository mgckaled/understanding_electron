<!-- @dsCard group="Components" viewport="700x220" subtitle="Bordered card, optional header + actions" name="Panel" -->
<link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<div id="root" style="background:var(--color-bg);padding:20px;height:100%;"></div>
<script type="text/plain" id="app-src">
const { Panel, Button } = window.Crivo;
function Demo() {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16, fontFamily: 'var(--font-ui)', color: 'var(--color-text)', maxWidth: 420 }}>
      <Panel title="Modelos em memória" actions={<Button variant="ghost" size="sm">↻</Button>}>
        <p style={{ margin: 0, fontSize: 13, color: 'var(--color-text-muted)' }}>gemma3:4b · 3,3 GB · sai em ~4 min</p>
      </Panel>
      <Panel>
        <p style={{ margin: 0, fontSize: 13 }}>Painel sem cabeçalho.</p>
      </Panel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<script>
(function(){
  var code = document.getElementById('app-src').textContent;
  var out = Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code;
  var s = document.createElement('script');
  s.text = out;
  document.body.appendChild(s);
})();
</script>
