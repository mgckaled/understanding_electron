<link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<div id="root" style="background:var(--color-bg);padding:20px;height:100%;"></div>
<script type="text/plain" id="app-src">
const { Toolbar, Button } = window.Crivo;
function Demo() {
  return (
    <Toolbar>
      <Button variant="primary">Escolher arquivo</Button>
      <Button variant="secondary">Cancelar</Button>
    </Toolbar>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<script>
(function(){
  var code = document.getElementById('app-src').textContent;
  var out = Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code;
  var s = document.createElement('script');
  s.text = out;
  document.body.appendChild(s);
})();
</script>
