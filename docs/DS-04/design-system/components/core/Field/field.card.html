<!-- @dsCard group="Components" viewport="700x220" subtitle="Label + hint/error, clones the child control" name="Field" -->
<link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<div id="root" style="background:var(--color-bg);padding:20px;height:100%;"></div>
<script type="text/plain" id="app-src">
const { Field } = window.Crivo;
function inputStyle() {
  return { width: 120, padding: '6px 8px', background: 'var(--color-surface-sunken)', color: 'var(--color-text)',
    border: '1px solid var(--color-border)', borderRadius: 'var(--radius-md)', fontFamily: 'var(--font-ui)', fontSize: 'var(--font-size-sm)' };
}
function Demo() {
  return (
    <div style={{ display: 'flex', gap: 24, fontFamily: 'var(--font-ui)' }}>
      <Field label="Threads de CPU" hint="Núcleos que o Ollama pode usar.">
        <input type="number" min={1} defaultValue={8} style={inputStyle()} />
      </Field>
      <Field label="Chave de API" error="Chave inválida.">
        <input type="password" style={inputStyle()} />
      </Field>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
<script>
(function(){
  var code = document.getElementById('app-src').textContent;
  var out = Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code;
  var s = document.createElement('script');
  s.text = out;
  document.body.appendChild(s);
})();
</script>
