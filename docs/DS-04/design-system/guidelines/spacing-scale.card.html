<!-- @dsCard group="Spacing" viewport="700x160" subtitle="space-1 (2px) to space-9 (48px)" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--color-bg);height:100%;padding:16px;box-sizing:border-box;font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted);">
  <div style="display:flex;align-items:flex-end;gap:6px;height:56px;">
    <div style="width:var(--space-1);height:2px;background:var(--color-accent);"></div>
    <div style="width:var(--space-2);height:4px;background:var(--color-accent);"></div>
    <div style="width:var(--space-3);height:6px;background:var(--color-accent);"></div>
    <div style="width:var(--space-4);height:8px;background:var(--color-accent);"></div>
    <div style="width:var(--space-5);height:12px;background:var(--color-accent);"></div>
    <div style="width:var(--space-6);height:16px;background:var(--color-accent);"></div>
    <div style="width:var(--space-7);height:24px;background:var(--color-accent);"></div>
    <div style="width:var(--space-8);height:32px;background:var(--color-accent);"></div>
    <div style="width:var(--space-9);height:48px;background:var(--color-accent);"></div>
  </div>
  <div style="display:flex;gap:6px;margin-top:6px;">
    <span style="width:2px;">1</span><span style="width:4px;">2</span><span style="width:6px;">3</span>
    <span style="width:8px;">4</span><span style="width:12px;">5</span><span style="width:16px;">6</span>
    <span style="width:24px;">7</span><span style="width:32px;">8</span><span style="width:48px;">9</span>
  </div>
</div>
