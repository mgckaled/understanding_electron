<!-- @dsCard group="Type" viewport="700x260" subtitle="Chrome scale (t-shirt) vs. the reading surface" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--color-bg);height:100%;padding:16px;box-sizing:border-box;font-family:var(--font-ui);color:var(--color-text);">
  <div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-faint);margin-bottom:8px;">Chrome — scanned, not read</div>
  <div style="display:flex;align-items:baseline;gap:16px;margin-bottom:16px;">
    <span style="font-size:11px;">2xs 11px</span>
    <span style="font-size:12px;">xs 12px</span>
    <span style="font-size:13px;font-weight:600;">sm 13px (body)</span>
    <span style="font-size:14px;">md 14px</span>
    <span style="font-size:16px;">lg 16px</span>
    <span style="font-size:20px;">xl 20px</span>
    <span style="font-size:28px;">2xl 28px</span>
  </div>
  <div style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-faint);margin-bottom:8px;">Reading — a model's answer, read for a minute straight</div>
  <p style="font-size:var(--font-size-reading);line-height:1.5;margin:0;max-width:520px;">18px — off the t-shirt scale on purpose, its own token so "make the chat bigger" is one number.</p>
</div>
