<!-- @dsCard group="Colors" viewport="700x260" subtitle="Semantic tokens, dark theme (default)" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--color-bg);height:100%;padding:16px;box-sizing:border-box;font-family:var(--font-ui);">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
    <div style="background:var(--color-surface);border:1px solid var(--color-border);border-radius:8px;padding:10px;color:var(--color-text);font-size:12px;">surface</div>
    <div style="background:var(--color-surface-raised);border:1px solid var(--color-border);border-radius:8px;padding:10px;color:var(--color-text);font-size:12px;">surface-raised</div>
    <div style="background:var(--color-surface-sunken);border:1px solid var(--color-border);border-radius:8px;padding:10px;color:var(--color-text);font-size:12px;">surface-sunken</div>
    <div style="background:var(--color-bg);border:1px solid var(--color-border-strong);border-radius:8px;padding:10px;color:var(--color-text);font-size:12px;">border-strong</div>
    <div style="background:var(--color-accent);border-radius:8px;padding:10px;color:var(--color-on-accent);font-size:12px;">accent (fill)</div>
    <div style="background:var(--color-surface);border-radius:8px;padding:10px;color:var(--color-accent-text);font-size:12px;">accent-text</div>
    <div style="background:var(--color-danger);border-radius:8px;padding:10px;color:var(--color-on-danger);font-size:12px;">danger (fill)</div>
    <div style="background:var(--color-surface);border-radius:8px;padding:10px;color:var(--color-danger-text);font-size:12px;">danger-text</div>
    <div style="background:var(--color-warn);border-radius:8px;padding:10px;color:#0b0c0e;font-size:12px;">warn (fill)</div>
    <div style="background:var(--color-surface);border-radius:8px;padding:10px;color:var(--color-warn-text);font-size:12px;">warn-text</div>
    <div style="background:var(--color-ok);border-radius:8px;padding:10px;color:#0b0c0e;font-size:12px;">ok (fill)</div>
    <div style="background:var(--color-surface);border-radius:8px;padding:10px;color:var(--color-ok-text);font-size:12px;">ok-text</div>
  </div>
  <div style="margin-top:10px;display:flex;gap:16px;font-size:11px;color:var(--color-text-faint);">
    <span style="color:var(--color-text);">text</span>
    <span style="color:var(--color-text-muted);">text-muted</span>
    <span style="color:var(--color-text-faint);">text-faint</span>
  </div>
</div>
