<!-- @dsCard group="Colors" viewport="700x180" subtitle="Syntax highlighting palette (Primer, imported)" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--color-surface-sunken);height:100%;padding:16px;box-sizing:border-box;font-family:var(--font-mono);font-size:13px;border-radius:8px;">
  <div><span style="color:var(--syntax-keyword);">const</span> <span style="color:var(--syntax-constant);">CAPABILITY_LABEL</span> = {
  <span style="color:var(--syntax-string);">'vision'</span>: <span style="color:var(--syntax-string);">'imagem'</span>,
  <span style="color:var(--syntax-string);">'tools'</span>: <span style="color:var(--syntax-string);">'ferramentas'</span>
  <span style="color:var(--syntax-comment);">// capabilities the app has a word for</span>
  }
  </div>
  <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--color-text-faint);">
    <span>keyword</span><span>entity</span><span>constant</span><span>string</span><span>builtin</span><span>tag</span>
  </div>
</div>
