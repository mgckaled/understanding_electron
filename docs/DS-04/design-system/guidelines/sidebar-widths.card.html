<!-- @dsCard group="Spacing" viewport="700x160" subtitle="Sidebar width: expanded vs collapsed" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--color-bg);height:100%;padding:16px;box-sizing:border-box;display:flex;gap:20px;font-family:var(--font-mono);font-size:10px;color:var(--color-text-muted);">
  <div style="text-align:center;">
    <div style="width:var(--sidebar-width);height:100px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:6px;"></div>
    <div style="margin-top:4px;">expanded 264px</div>
  </div>
  <div style="text-align:center;">
    <div style="width:var(--sidebar-width-collapsed);height:100px;background:var(--color-surface);border:1px solid var(--color-border);border-radius:6px;"></div>
    <div style="margin-top:4px;">collapsed 44px</div>
  </div>
</div>
