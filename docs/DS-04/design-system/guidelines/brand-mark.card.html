<link rel="stylesheet" href="../styles.css">
<div style="background:var(--color-bg);height:100%;padding:24px;box-sizing:border-box;display:flex;gap:32px;align-items:center;font-family:var(--font-ui);color:var(--color-text);">
  <div style="text-align:center;">
    <div style="width:96px;height:96px;background:var(--color-surface);border-radius:16px;display:flex;align-items:center;justify-content:center;">
      <img src="../assets/logo-monogram.svg" style="width:56px;height:56px;" />
    </div>
    <div style="font-size:11px;color:var(--color-text-faint);margin-top:8px;">logo-monogram.svg</div>
  </div>
  <div style="text-align:center;">
    <img src="../assets/app-icon.png" style="width:96px;height:96px;border-radius:16px;" />
    <div style="font-size:11px;color:var(--color-text-faint);margin-top:8px;">app-icon.png</div>
  </div>
  <div style="max-width:280px;font-size:13px;color:var(--color-text-muted);line-height:1.5;">
    <strong style="color:var(--color-text);">crivo</strong> — lowercase always, never capitalized in running text or UI.
  </div>
