  <!-- col 1 — marca isolada -->
  <use href="#mark" transform="translate(46,52)" fill="#0d5bd9"/>
  <text x="50" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6b7280">marca</text>

  <!-- col 2 — ícone, tema escuro -->
  <rect x="118" y="8" width="84" height="84" rx="18" fill="#16171a"/>
  <use href="#mark" transform="translate(158,50)" fill="#4c8dff"/>
  <text x="160" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6b7280">ícone · tema escuro</text>

  <!-- col 3 — ícone, tema claro -->
  <rect x="228" y="8" width="84" height="84" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <use href="#mark" transform="translate(268,50)" fill="#0d74ce"/>
  <text x="270" y="128" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6b7280">ícone · tema claro</text>
</svg>
