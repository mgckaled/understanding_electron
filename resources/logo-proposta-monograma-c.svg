<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140">
  <title>crivo — proposta de monograma "C" vazado por pontos</title>

  <defs>
    <g id="mark">
      <circle cx="20.48" cy="14.34" r="2.2"/>
      <circle cx="11.99" cy="21.94" r="2.8"/>
      <circle cx="0.99" cy="24.98" r="3.3"/>
      <circle cx="-10.21" cy="22.83" r="3.7"/>
      <circle cx="-19.27" cy="15.93" r="3.8"/>
      <circle cx="-24.34" cy="5.70" r="4.0"/>
      <circle cx="-24.34" cy="-5.70" r="4.0"/>
      <circle cx="-19.28" cy="-15.93" r="3.8"/>
      <circle cx="-10.21" cy="-22.83" r="3.7"/>
      <circle cx="0.99" cy="-24.98" r="3.3"/>
      <circle cx="11.99" cy="-21.94" r="2.8"/>
      <circle cx="20.48" cy="-14.34" r="2.2"/>
      <circle cx="31.05" cy="7.74" r="2.0" opacity="0.55"/>
      <circle cx="38.45" cy="-11.02" r="1.3" opacity="0.3"/>
    </g>
